<!DOCTYPE html>
<html lang="en" data-theme="dark" data-aesthetic="obsidian">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BSIT301 Business Intelligence (BSIT301) · Study Drawing Set</title>
<meta name="description" content="Static exam-prep suite for BSIT301 Business Intelligence: chapter study sheets for Chapters 1, 2, 3, 4 and 6, an interactive mind map, a five-diagram architecture lab, a 40-mark Section A MCQ simulator, two 30-mark Section B workbenches, a Chapter 6 calculation element lab, a filterable past-paper drill arena and flashcards.">
<script>
  (function () {
    try {
      var t = localStorage.getItem("bsit301-theme");
      try { t = JSON.parse(t); } catch (e) {}
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      var a = localStorage.getItem("bsit_aesthetic");
      if (a === "blueprint" || a === "linear" || a === "obsidian" || a === "terminal" || a === "arcade")
        document.documentElement.setAttribute("data-aesthetic", a);
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&family=Big+Shoulders+Display:wght@700;800;900&family=Martian+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="topbar">
  <button class="menu-btn" id="menuBtn" aria-label="Open drawing index" aria-expanded="false">
    <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.8" fill="none"></path></svg>
  </button>
  <a class="brand" href="#A-00">
    <span class="brand-code">BSIT301</span>
    <span class="brand-sub"><span class="label">Drawing set</span><b>Business Intelligence (BSIT301) · Study suite</b></span>
  </a>
  <div class="topbar-cell hide-sm"><span class="label">Sheets reviewed</span><span class="val" id="tbProgress">0 / 0</span></div>
  <div class="topbar-cell hide-sm"><span class="label">Best result</span><span class="val" id="tbBest">—</span></div>
  <div class="topbar-spacer"></div>
  <div class="search-wrap">
    <input id="search" type="search" placeholder="Search sheets, nodes, questions…" autocomplete="off" aria-label="Search">
    <span class="kbd">Ctrl K</span>
    <div class="search-results" id="searchResults"></div>
  </div>
  <div class="theme-picker" id="themePicker">
    <button type="button" class="theme-btn" id="themeBtn" aria-haspopup="true" aria-expanded="false" title="Switch design aesthetic">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.6a6.4 6.4 0 1 0 0 12.8c1 0 1.5-.6 1.5-1.3 0-.4-.2-.7-.4-.9-.2-.3-.4-.6-.4-1 0-.7.6-1.3 1.3-1.3h1.4A3.6 3.6 0 0 0 14.4 8 6.4 6.4 0 0 0 8 1.6z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"></path><circle cx="5" cy="6" r="1" fill="currentColor"></circle><circle cx="8" cy="4.6" r="1" fill="currentColor"></circle><circle cx="11" cy="6.4" r="1" fill="currentColor"></circle></svg>
      <span class="txt">Theme</span>
      <span class="swatch" id="themeSwatch" aria-hidden="true"></span>
    </button>
    <div class="theme-menu" id="themeMenu" role="menu" aria-label="Design aesthetic"></div>
  </div>
  <div class="theme-switch">
    <span class="label hide-sm">Print</span>
    <div class="seg" role="group" aria-label="Colour theme">
      <button type="button" data-theme-btn="light" aria-pressed="false" title="Light mode (whiteprint)">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.5"></circle><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6L13 13M3 13l1.4-1.4M11.6 4.4L13 3" stroke="currentColor" stroke-width="1.5"></path></svg>
        <span class="txt">Light</span>
      </button>
      <button type="button" data-theme-btn="dark" aria-pressed="true" title="Dark mode">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M12.5 10.2A5.5 5.5 0 0 1 5.8 3.5a5.5 5.5 0 1 0 6.7 6.7z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"></path></svg>
        <span class="txt">Dark</span>
      </button>
    </div>
  </div>
</header>

<div class="layout">
  <nav class="index" id="index" aria-label="Drawing index"></nav>
  <main id="main"></main>
</div>

<script src="data/bsit_data.js"></script>
<script src="js/calculations.js"></script>
<script src="js/diagrams.js"></script>
<script src="js/sectionb.js"></script>
<script src="js/practice.js"></script>
<script src="js/drillbank.js"></script>
<script src="js/app.js"></script>
</body>
</html>
